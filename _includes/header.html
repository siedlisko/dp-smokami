<header class="site-header" id="siteHeader" role="banner">
  <div class="site-header-inner">
    <a class="brand" href="{% if page.lang == 'en' %}{{ site.baseurl }}/en/index.html{% else %}{{ site.baseurl }}/index.html{% endif %}" aria-label="Dom Pod Smokami">
      <h1 class="visually-hidden">Dom Pod Smokami</h1>
      
      <!-- Logo dla komputerów -->
      <img src="{{ site.baseurl }}/assets/img/logo-pod-smokami-white.png" alt="Dom Pod Smokami" class="logo logo-desktop" loading="eager">
      
      <!-- Logo dla telefonów -->
      <img src="{{ site.baseurl }}/assets/img/logo-pod-smokami-white3.png" alt="Dom Pod Smokami" class="logo logo-mobile" style="display: none;" loading="eager">
    </a>

    <button class="nav-toggle" id="navToggle" aria-label="Pokaż menu" aria-expanded="false" aria-controls="siteNav">
      <span class="hamburger"></span>
    </button>
    
    <nav class="site-nav" id="siteNav" role="navigation" aria-label="Główne menu">
      <ul>
        {% if page.lang == 'en' %}
          <li><a href="{{ site.baseurl }}/en/#apartamenty" class="btn-nav">Apartments</a></li>
          <li><a href="{{ site.baseurl }}/en/galeria.html" class="btn-nav">Gallery</a></li>
          <li><a href="{{ site.baseurl }}/en/kontakt.html" class="btn-nav">Contact</a></li>
          <li class="nav-lang-item"><a href="{{ site.baseurl }}/index.html" class="btn-nav lang-switch">🇵🇱 PL</a></li>
        {% else %}
          <li><a href="{{ site.baseurl }}/#apartamenty" class="btn-nav">Apartamenty</a></li>
          <li><a href="{{ site.baseurl }}/galeria.html" class="btn-nav">Galeria</a></li>
          <li><a href="{{ site.baseurl }}/kontakt.html" class="btn-nav">Kontakt</a></li>
          <li class="nav-lang-item"><a href="{{ site.baseurl }}/en/index.html" class="btn-nav lang-switch">🇬🇧 EN</a></li>
        {% endif %}
      </ul>
    </nav>
  </div>
</header>
