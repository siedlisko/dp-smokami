<!doctype html>
<html lang="pl">
<head>
  {% include head.html %}
</head>
<body>

  {% include header.html %}

  <main class="site-main" role="main">
    {{ content }}
  </main>

  {% include footer.html %}

  <script>
document.addEventListener('DOMContentLoaded', function() {
  let lastScrollTop = 0;
  // Celujemy bezpośrednio w wewnętrzny kontener z logo
  const logoBar = document.querySelector('.site-header-inner');

  if (!logoBar) return;

  window.addEventListener('scroll', function() {
    let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
    
    if (scrollTop <= 10) {
      logoBar.classList.remove('scroll-up', 'scroll-down');
      lastScrollTop = scrollTop;
      return;
    }

    if (scrollTop > lastScrollTop) {
      // Przewijanie W DÓŁ -> chowamy logo
      logoBar.classList.add('scroll-down');
      logoBar.classList.remove('scroll-up');
    } else {
      // Przewijanie W GÓRĘ -> pokazujemy logo
      logoBar.classList.add('scroll-up');
      logoBar.classList.remove('scroll-down');
    }
    
    lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
  }, { passive: true });
});
</script>

</body>
</html>
