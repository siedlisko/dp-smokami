<!doctype html>
<html lang="pl">
<head>
  {% include head.html %}
</head>
<body>

  {% include header.html %}

  <main class="site-main" role="main">
    {{ content }}
  </main>

  {% include footer.html %}

  <script>
document.addEventListener('DOMContentLoaded', function() {
  let lastScrollTop = 0;
  
  const brandAnchor = document.querySelector('.brand') || document.querySelector('.site-header a.brand');
  const brandImg = brandAnchor ? brandAnchor.querySelector('img') : null;

  if (!brandAnchor || !brandImg) return;

  // Wpisz tutaj poprawną ścieżkę do nowego logo oraz zapamiętaj oryginalną dla desktopu
  const mobileLogoSrc = 'assets/img/logo-pod-smokami-white3.png';
  const desktopLogoSrc = brandImg.getAttribute('src');

  // Funkcja zmieniająca obrazek w zależności od szerokości ekranu
  function updateLogoSource() {
    if (window.innerWidth <= 767) {
      if (brandImg.getAttribute('src') !== mobileLogoSrc) {
        brandImg.setAttribute('src', mobileLogoSrc);
      }
    } else {
      if (brandImg.getAttribute('src') !== desktopLogoSrc) {
        brandImg.setAttribute('src', desktopLogoSrc);
      }
    }
  }

  // Wywołaj na starcie i przy zmianie rozmiaru okna
  updateLogoSource();
  window.addEventListener('resize', updateLogoSource);

  // Obsługa chowania/wysuwania logo przy scrollowaniu
  window.addEventListener('scroll', function() {
    if (window.innerWidth > 767) return;

    let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
    
    if (scrollTop <= 15) {
      brandAnchor.classList.remove('scroll-up', 'scroll-down');
      lastScrollTop = scrollTop;
      return;
    }

    if (scrollTop > lastScrollTop) {
      brandAnchor.classList.add('scroll-down');
      brandAnchor.classList.remove('scroll-up');
    } else {
      brandAnchor.classList.add('scroll-up');
      brandAnchor.classList.remove('scroll-down');
    }
    
    lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
  }, { passive: true });
});
</script>

</body>
</html>
