<!doctype html>
<html lang="pl">
<head>
  {% include head.html %}
</head>
<body>

  {% include header.html %}

  <main class="site-main" role="main">
    {{ content }}
  </main>

  {% include footer.html %}

  <script>
document.addEventListener('DOMContentLoaded', function() {
  let lastScrollTop = 0;
  // Celujemy wyłącznie w element z logo
  const brandLogo = document.querySelector('.brand') || document.querySelector('.site-header a.brand');

  if (!brandLogo) return;

  window.addEventListener('scroll', function() {
    let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
    
    // Na samej górze strony logo zawsze widoczne
    if (scrollTop <= 15) {
      brandLogo.classList.remove('scroll-up', 'scroll-down');
      lastScrollTop = scrollTop;
      return;
    }

    if (scrollTop > lastScrollTop) {
      // Przewijanie W DÓŁ -> schowaj logo
      brandLogo.classList.add('scroll-down');
      brandLogo.classList.remove('scroll-up');
    } else {
      // Przewijanie W GÓRĘ -> pokaż logo
      brandLogo.classList.add('scroll-up');
      brandLogo.classList.remove('scroll-down');
    }
    
    lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
  }, { passive: true });
});
</script>

</body>
</html>
