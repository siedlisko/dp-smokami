<!doctype html>
<html lang="pl">
<head>
  {% include head.html %}
</head>
<body>

  {% include header.html %}

  <main class="site-main" role="main">
    {{ content }}
  </main>

  {% include footer.html %}

  <script>
document.addEventListener('DOMContentLoaded', function() {
  let lastScrollTop = 0;
  // Szukamy nagłówka na podstawie id lub klasy
  const siteHeader = document.getElementById('siteHeader') || document.querySelector('.site-header');

  if (!siteHeader) return; // Jeśli na jakiejś podstronie nie ma nagłówka, skrypt bezpiecznie się wyłączy

  window.addEventListener('scroll', function() {
    let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
    
    // Próg przy samej górze strony
    if (scrollTop <= 10) {
      siteHeader.classList.remove('scroll-up', 'scroll-down');
      lastScrollTop = scrollTop;
      return;
    }

    if (scrollTop > lastScrollTop) {
      // Przewijanie W DÓŁ -> ukrycie
      siteHeader.classList.add('scroll-down');
      siteHeader.classList.remove('scroll-up');
    } else {
      // Przewijanie W GÓRĘ -> pokazanie
      siteHeader.classList.add('scroll-up');
      siteHeader.classList.remove('scroll-down');
    }
    
    lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
  }, { passive: true });
});
</script>

</body>
</html>
